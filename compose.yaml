name: ${COMPOSE_PROJECT_NAME:-hts}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-image: &backend-image
  image: ${HTS_BACKEND_IMAGE:-${HTS_IMAGE_NAMESPACE:-local}/hts-backend:${HTS_IMAGE_TAG:-latest}}

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: "3108"
  TZ: UTC
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: ${MYSQL_DATABASE:-hts}
  DB_USER: ${MYSQL_USER:-hts}
  DB_PASSWORD: ${MYSQL_PASSWORD:?Chua cau hinh MYSQL_PASSWORD}
  DB_POOL_MIN: "0"
  DB_POOL_MAX: "3"
  JWT_SECRET: ${JWT_SECRET:?Chua cau hinh JWT_SECRET}
  CSRF_SECRET: ${CSRF_SECRET:?Chua cau hinh CSRF_SECRET}
  BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
  AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-hts_session}
  AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
  AUTH_COOKIE_SAME_SITE: lax
  CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-}
  CORS_ALLOW_SAME_ORIGIN: "${CORS_ALLOW_SAME_ORIGIN:-true}"
  TRUST_PROXY: "1"
  LOG_LEVEL: info
  LOG_MAX_SIZE: 20m
  LOG_RETENTION: 30d
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: UTC
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hts}
      MYSQL_USER: ${MYSQL_USER:-hts}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Chua cau hinh MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Chua cau hinh MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-connections=100"]
    volumes:
      - type: bind
        source: ${HTS_DATA_DIR:-./data}/mysql
        target: /var/lib/mysql
        bind:
          create_host_path: false
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging: *logging

  migrate:
    <<: *backend-image
    command: ["pnpm", "migrate"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${HTS_DATA_DIR:-./data}/logs
        target: /app/logs
        bind:
          create_host_path: false
    networks: [database]
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  backend:
    <<: *backend-image
    restart: unless-stopped
    init: true
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${HTS_DATA_DIR:-./data}/logs
        target: /app/logs
        bind:
          create_host_path: false
    networks: [database, application]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3108/api/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  web:
    image: ${HTS_WEB_IMAGE:-${HTS_IMAGE_NAMESPACE:-local}/hts-web:${HTS_IMAGE_TAG:-latest}}
    restart: unless-stopped
    environment:
      HTS_SITE_ADDRESS: ${HTS_SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ${HTS_DATA_DIR:-./data}/caddy/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${HTS_DATA_DIR:-./data}/caddy/config
        target: /config
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    networks: [application]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *logging


  # Chỉ chạy khi gọi: docker compose run --rm backup
  backup:
    image: mysql:8.4
    profiles: [tools]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hts}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Chua cau hinh MYSQL_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        file="/backups/hts-$$(date -u +%Y%m%dT%H%M%SZ)-$$(cat /proc/sys/kernel/random/uuid).sql"
        trap 'rm -f "$$file.tmp"' EXIT
        export MYSQL_PWD="$$MYSQL_ROOT_PASSWORD"
        mysqldump -h db -u root --single-transaction --quick --no-tablespaces --set-gtid-purged=OFF --routines --events --triggers "$$MYSQL_DATABASE" > "$$file.tmp"
        test -s "$$file.tmp"
        mv "$$file.tmp" "$$file"
        sha256sum "$$file" > "$$file.sha256"
        cp /config/hts.env "$$file.env"
        echo "Đã backup: $$file"
    volumes:
      - type: bind
        source: ${HTS_DATA_DIR:-./data}/backups
        target: /backups
        bind:
          create_host_path: false
      - type: bind
        source: ${HTS_ENV_FILE:-./.env}
        target: /config/hts.env
        read_only: true
        bind:
          create_host_path: false
    networks: [database]
    depends_on:
      db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  database:
    internal: true
  application:
